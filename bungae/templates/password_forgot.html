{% extends "base.html" %}
{% block title %}비밀번호 찾기 · 번개팟구{% endblock %}
{% block content %}
<div class="auth">
  <header class="page-head">
    <h1 class="page-title">비밀번호 다시 정하기</h1>
    <p class="page-sub">가입할 때 쓴 학교 이메일로 재설정 코드를 보내 드려요.</p>
  </header>

  <section class="panel">
    {% if error %}
    <p class="alert alert--error" role="alert">{{ error }}</p>
    {% endif %}
    <form class="form" method="post" action="{{ url_for('auth.password_forgot') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field__label" for="email">학교 이메일</label>
        <input class="input{% if error %} is-invalid{% endif %}" type="email" id="email" name="email" value="{{ email }}" placeholder="학번@soongsil.ac.kr" autocomplete="email" inputmode="email" maxlength="120" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">재설정 코드 받기</button>
    </form>
  </section>

  <p class="auth__switch"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
